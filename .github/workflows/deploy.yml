# Envoie le site sur Hostinger (levelstudios-corp.com) à chaque push sur main.
# Secrets à définir dans GitHub → Settings → Secrets and variables → Actions :
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Variable facultative FTP_DIR : dossier distant (par défaut public_html/).
name: Déploiement Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      vider:
        description: "Supprimer tout le contenu de public_html avant l'envoi"
        type: boolean
        default: false

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - name: Envoi FTP vers levelstudios-corp.com
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
          dangerous-clean-slate: ${{ inputs.vider == true }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            README.md

      - name: Identifiants FTP manquants
        if: env.FTP_SERVER == ''
        run: echo "::warning::Ajoute les secrets FTP_SERVER, FTP_USERNAME et FTP_PASSWORD pour activer le déploiement."
