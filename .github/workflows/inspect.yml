# Lecture seule : affiche l'arborescence FTP pour vérifier le bon dossier avant un déploiement.
name: Inspection FTP

on:
  workflow_dispatch:
    inputs:
      chemin:
        description: "Dossier à lister"
        default: "/"
      utilisateur:
        description: "Utilisateur FTP (vide = secret FTP_USERNAME)"
        default: ""
      compte_reviz:
        description: "Utiliser le mot de passe du compte FTP ReviZ"
        type: boolean
        default: false

jobs:
  lister:
    runs-on: ubuntu-latest
    steps:
      - name: Lister le dossier
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ inputs.utilisateur || secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ inputs.compte_reviz && secrets.REVIZ_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          CHEMIN: ${{ inputs.chemin }}
        run: |
          echo "== $CHEMIN"
          curl -sS --ftp-pasv --connect-timeout 20 --max-time 90 --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/${CHEMIN#/}/" --list-only
