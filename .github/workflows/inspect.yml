# Lecture seule : affiche l'arborescence FTP pour vérifier le bon dossier avant un déploiement.
name: Inspection FTP

on:
  workflow_dispatch:
    inputs:
      chemin:
        description: "Dossier à lister"
        default: "/"

jobs:
  lister:
    runs-on: ubuntu-latest
    steps:
      - name: Lister le dossier
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          CHEMIN: ${{ inputs.chemin }}
        run: |
          for u in "$FTP_USERNAME" "$FTP_USERNAME.levelstudios-corp.com"; do
            echo "== utilisateur ${u/$FTP_USERNAME/<FTP_USERNAME>} · $CHEMIN"
            curl -s --ftp-pasv --user "$u:$FTP_PASSWORD" "ftp://$FTP_SERVER/${CHEMIN#/}/" --list-only && echo "OK" || echo "refusé (code $?)"
          done
