# Diagnostic : quels envois FTP Hostinger accepte (fichier normal vs .htaccess) dans un dossier de test.
name: Test FTP

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Envois de test
        env:
          FTP: ftp://${{ secrets.FTP_SERVER }}/domains/levelstudios-corp.com/test-ftp
          FTP_AUTH: ${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}
        run: |
          echo bonjour > a.txt
          printf 'Require all denied\n' > h
          t() { echo "== $1"; curl -sS --ftp-pasv --ftp-create-dirs --max-time 60 --user "$FTP_AUTH" -T "$2" "$FTP/$1" && echo OK || echo "ÉCHEC $?"; }
          t a.txt a.txt
          t .htaccess h
          t htaccess.txt h
          echo "== liste"; curl -sS --ftp-pasv --max-time 60 --user "$FTP_AUTH" "$FTP/" --list-only
          for f in a.txt .htaccess htaccess.txt; do curl -sS --max-time 30 --user "$FTP_AUTH" -Q "DELE /domains/levelstudios-corp.com/test-ftp/$f" "$FTP/" -o /dev/null; done
          curl -sS --max-time 30 --user "$FTP_AUTH" -Q "RMD /domains/levelstudios-corp.com/test-ftp" "ftp://${{ secrets.FTP_SERVER }}/" -o /dev/null && echo "nettoyé"
